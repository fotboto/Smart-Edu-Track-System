{% extends 'classroom/base.html' %}
{% load bootstrap4 %}
{% block content %}

<div class="container">
<div class="jumbotron">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Update Marks</h1>
    <a href="{% url 'classroom:submit_list' %}" class="btn btn-secondary">
      <i class="fas fa-arrow-left mr-1"></i> Back to Submissions
    </a>
  </div>
  
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <div class="mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save mr-1"></i> Update Marks
          </button>
          <a href="{% url 'classroom:submit_list' %}" class="btn btn-outline-secondary ml-2">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
{% endblock %}
